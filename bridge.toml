# Unofficial bridge: mirrors therichronicles/EarthCraft releases for Craft Unofficial Launcher.
# Run by https://github.com/YalKouassi/craft-bridge (its README explains every key).

[bridge]
upstream = "therichronicles/EarthCraft"
repo = "YalKouassi/earthcraft-for-unofficial-launcher"
upstream_sums = ["SHA256SUMS.txt"]
# Not mirrored: the portable zips (their earthcraft.exe carries no version resource, which the
# launcher needs to confirm a portable install, so Windows gets the MSI), the setup .exe, snaps,
# AppImage delta files and the macOS self-update zip.
skip = ['-portable\.zip$', '-windows-x64\.exe$', '\.snap$', '\.zsync$', '-update\.zip$']

[descriptor]
id = "earthcraft"
name = "EarthCraft"
tagline = "3D globe explorer with satellite imagery, live aircraft, ships and weather"
publisher = "EarthCraft contributors"
bundle_id = "com.theri.earthcraft"   # upstream's Flatpak and AppStream id
msi_publisher = "EarthCraft"         # Manufacturer in upstream's MSIs (x64 and arm64)
website = "https://github.com/therichronicles/EarthCraft"
color = "#11b8a0"

[icon]
url = "https://raw.githubusercontent.com/{upstream}/{tag}/assets/packaging/icon_256.png"

[[rename]]
match = 'earthcraft-(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)-windows-(?P<arch>x64|arm64)\.msi'
to = '{id}-{version}-windows-{arch}.msi'

[[rename]]
match = 'earthcraft-(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)-macos-arm64\.dmg'
to = '{id}-{version}-macos-arm64.dmg'

[[rename]]
match = 'earthcraft-(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)-(?P<os>linux|freebsd)-(?P<arch>x64|arm64)(?P<ext>\.tar\.gz|\.AppImage|\.deb|\.rpm|\.flatpak)'
to = '{id}-{version}-{os}-{arch}{ext}'
map = { arch = { x64 = "x86_64", amd64 = "x86_64", arm64 = "aarch64" } }
